# Homelab Ansible Inventory
# Run: ansible-playbook -i inventory.yml site.yml

all:
  children:
    proxmox_hosts:
      hosts:
        pve:
          ansible_host: 192.168.50.104
          ansible_user: root
          ansible_connection: local

    docker_hosts:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: /root/.ssh/id_rsa
      hosts:
        k3s-01:
          ansible_host: 192.168.50.50
        media-docker:
          ansible_host: 192.168.50.128
        tdarr:
          ansible_host: 192.168.50.128

    k8s_hosts:
      vars:
        ansible_user: root
        kubeconfig_path: /root/.kube/config-k3s
      hosts:
        k3s-01:
          ansible_host: 192.168.50.50
          k8s_role: control-plane
