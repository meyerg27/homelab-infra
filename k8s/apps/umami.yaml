---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:postgresql-latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgresql://umami:umamiSecure2026@postgres-svc.homelab:5432/umami
            - name: TRACKER_SCRIPT_NAME
              value: umami.js
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: umami-svc
  namespace: homelab
spec:
  selector:
    app: umami
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umami-ingress
  namespace: homelab
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: traefik
spec:
  tls:
    - hosts:
        - analytics.meyernet.xyz
      secretName: umami-tls
  rules:
    - host: analytics.meyernet.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umami-svc
                port:
                  number: 80
