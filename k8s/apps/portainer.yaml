# NOTE: Portainer requires Docker socket which K3s doesn't have.
# Use the existing Portainer CT (CT 102) directly instead.
# This manifest is kept for reference but portainer deployment is scaled to 0.
---
apiVersion: v1
kind: Service
metadata:
  name: portainer-svc
  namespace: homelab
spec:
  selector:
    app: portainer
  ports:
  - name: http
    port: 80
    targetPort: 9000
  - name: https
    port: 443
    targetPort: 9443
  type: LoadBalancer
