apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umami-ingress
  namespace: homelab
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: umami.k3s.meyernet.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: umami-svc
            port:
              number: 80
---
