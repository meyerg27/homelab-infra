#────────────────────────────────────────────
# MetalLB — Load Balancer for K3s
# Gives services external IPs from 192.168.50.200-250 pool
#────────────────────────────────────────────

apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: metallb-system
spec:
  # No special config needed for L2 mode (ARP)
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.50.200-192.168.50.250
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
  # Optionally limit to specific interfaces
  # interfaces:
  #   - eth0
