#────────────────────────────────────────────
# cert-manager — Automatic TLS with Let's Encrypt
# Installs via Helm, creates ClusterIssuer for Cloudflare DNS
# Run: kubectl apply -f cert-manager.yaml
# Then: kubectl apply -f letsencrypt-clusterissuer.yaml
#────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  version: v1.16.2
  targetNamespace: cert-manager
  valuesContent: |
    installCRDs: true
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      enabled: true
      fsGroup: 1001
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    startupapicheck:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
---
# Cloudflare API Secret (create manually)
# kubectl create secret generic cloudflare-api-token \
#   -n cert-manager \
#   --from-literal=api-token=<YOUR_CF_TOKEN>
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: graysonmeyer@icloud.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
