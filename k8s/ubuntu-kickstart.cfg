# Ubuntu 24.04 Autoinstall (Kickstart)
# Used for fully automated K3s VM installation
version: 1

early-commands:
  # Wait for network
  - while [ ! -d /target ]; do sleep 5; done
  - mkdir -p /target/opt
  - curl -sfL https://get.k3s.io -o /target/opt/k3s-installer.sh
  - chmod +x /target/opt/k3s-installer.sh

keyboard:
  layout: us

locale: en_US.UTF-8

network:
  network: ethers
  version: 2

proxy: ""

 snaps:
   - name: docker
     channel: stable
     classic: true

packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - qemu-guest-agent

identity:
  hostname: k3s-01
  password: $6$rounds=4096$MeyerNet2026$hAhAHASH/
  # Real hash: openssl passwd -6 "MeyerNet2026"
  # DO NOT use this hash - generate your own
  users:
    - name: ubuntu
      sudo: ALL=(ALL) NOPASSWD: ALL
      ssh-import-id: []

access-model: public_key
ssh:
  install-server: true
  authorized-keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPCGZ3du6N2kFBOqOFFh3qqdBP6pusXb2gRly13E8Yp+ root@openclaw
  allow-pw: false

storage:
  config:
    - type: disk
      id: disk-0
      match:
        size: largest
    - type: partition
      id: boot-partition
      device: disk-0
      size: 2G
      wipe: superblock-recursive
    - type: partition
      id: root-partition
      device: disk-0
      size: -1
      wipe: superblock-recursive
    - type: format
      id: boot-fs
      volume: boot-partition
      fstype: ext4
    - type: format
      id: root-fs
      volume: root-partition
      fstype: ext4
    - type: mount
      id: mount-boot
      device: boot-fs
      path: /boot
    - type: mount
      id: mount-root
      device: root-fs
      path: /

final-message: "Installation complete! Rebooting..."

poweroff: true
